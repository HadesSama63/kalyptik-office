name: Update submodules to latest main branch

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  update-submodules:
    if: github.repository_owner == 'Euro-Office'   # Kalyptik: désactivé hors Euro-Office
    permissions:
      contents: write
      pull-requests: write
    uses: Euro-Office/DocumentServer/.github/workflows/update-submodules.yml@main
    secrets: inherit
